name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to publish:
#
# build     one binary per platform, packed with README and LICENSE
# release   a GitHub release with every archive and its SHA-256, then the
#           Homebrew formula in Formula/paddock.rb updated on main
# npm       paddock-cli and its platform packages, when the NPM_TOKEN secret
#           is set (skipped otherwise)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-15, npm: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, npm: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, npm: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          name=paddock-${{ matrix.target }}
          mkdir -p dist/$name npm-bin
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          cp target/${{ matrix.target }}/release/paddock$exe dist/$name/
          cp README.md LICENSE dist/$name/
          cp target/${{ matrix.target }}/release/paddock$exe npm-bin/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip $name.zip $name >/dev/null
            sha256sum $name.zip > $name.zip.sha256
          else
            tar czf $name.tar.gz $name
            shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
          fi
          rm -rf $name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.npm }}
          path: npm-bin/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk -v v="$version" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          [ -n "$notes" ] || notes="Paddock $version"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Paddock $version" --notes "$notes"
      - name: Update the Homebrew formula
        run: |
          mkdir -p Formula
          python3 scripts/update-formula.py "${GITHUB_REF_NAME#v}" dist > Formula/paddock.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/paddock.rb
          git commit -m "Update Homebrew formula to ${GITHUB_REF_NAME}"
          git push origin main

  npm:
    needs: build
    runs-on: ubuntu-24.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without an npm token
        if: env.NPM_TOKEN == ''
        run: echo "Set the NPM_TOKEN secret to publish paddock-cli to npm."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NPM_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.NPM_TOKEN != ''
        with:
          pattern: npm-*
          path: npm-bins
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/publish-npm.py "${GITHUB_REF_NAME#v}" npm-bins
