[package]
name = "paddock"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Every dev server on this machine, in one place: a terminal dashboard that finds, groups and stops them"
license = "MIT"
repository = "https://github.com/musaJawad004/paddock"
readme = "README.md"
keywords = ["tui", "dev-server", "ports", "monitor", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# Not on crates.io until v1. Releases come from CI (cargo-dist).
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "paddock"
path = "src/main.rs"

[dependencies]
# Terminal UI
ratatui = "0.30.2"
# Same version ratatui uses, only to enable the async event stream.
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.2"

# Async runtime and event plumbing.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3.34"

# The process table (parents, folders, CPU, memory) and signals to stop
# what the user asks to stop.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
nix = { version = "0.28.0", features = ["signal", "user"] }

# CLI and config
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

# Errors
thiserror = "2.0.21"
color-eyre = "0.6.5"

[dev-dependencies]
tempfile = "3.27.0"
insta = "1.49.0"
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
